name: cuotaflex-fineract

services:
  db:
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Falta POSTGRES_ADMIN_PASSWORD}"
      FINERACT_DB_USER: "${FINERACT_DB_USER:?Falta FINERACT_DB_USER}"
      FINERACT_DB_PASSWORD: "${FINERACT_DB_PASSWORD:?Falta FINERACT_DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-cuotaflex.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -q -h 127.0.0.1 -d fineract_default -U "$$FINERACT_DB_USER"']
      interval: 2s
      timeout: 5s
      retries: 30

  fineract:
    image: apache/fineract:1.12.1@sha256:a83cf1980609c984281a4741344bfe1c6df8a0c2dcc0ae6cee337cded1dc53fe
    ports:
      - "127.0.0.1:${FINERACT_PORT:-8443}:8443"
    depends_on:
      db:
        condition: service_healthy
    environment:
      FINERACT_NODE_ID: "1"
      FINERACT_SERVER_SSL_ENABLED: "true"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: "${FINERACT_DB_USER:?Falta FINERACT_DB_USER}"
      FINERACT_HIKARI_PASSWORD: "${FINERACT_DB_PASSWORD:?Falta FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: "${FINERACT_TENANT:-default}"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_UID: "${FINERACT_DB_USER:?Falta FINERACT_DB_USER}"
      FINERACT_DEFAULT_TENANTDB_PWD: "${FINERACT_DB_PASSWORD:?Falta FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: America/Lima
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info
      FINERACT_REMOTE_JOB_MESSAGE_HANDLER_SPRING_EVENTS_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xmx1G -XX:TieredStopAtLevel=1 -XX:+UseStringDeduplication"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/fineract-provider/actuator/health"]
      interval: 3s
      timeout: 5s
      start_period: 15s
      retries: 90

volumes:
  postgres_data:
