[project]
name = "cuotaflex"
version = "0.1.0"
description = "Motor de cuotas que se adaptan al flujo del negocio · Cajathón 2026 (NEG-01)"
requires-python = ">=3.10"
# Mismas dependencias que requirements.txt (Vercel puede leer cualquiera de los dos)
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6",
    "cvxpy-base>=1.5",
    "highspy>=1.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "server:app"
