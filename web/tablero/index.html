<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F4F7" />
    <title>Thinku · Tablero de simulación</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Tema claro u oscuro antes de pintar (ver src/apariencia.tsx): evita un destello del tema equivocado. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cuotaflex.tema");
          if (t !== "claro" && t !== "oscuro") t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
          document.documentElement.dataset.tema = t;
          document.documentElement.style.colorScheme = t === "oscuro" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
