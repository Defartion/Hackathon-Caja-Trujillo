# Parámetros de negocio del motor CuotaFlex (Cajathón 2026 · NEG-01)
# Todo valor referencial: debe calibrarse con políticas reales de Caja Trujillo.

credito:
  tea_base: 0.45            # TEA referencial microempresa
  plazos_meses: [12, 18, 24]
  costo_fondeo_tea: 0.08    # costo de fondeo de la Caja
  costo_operativo_pct: 0.06 # gasto operativo anual sobre saldo promedio
  recuperacion_default: 0.30 # % del saldo que se recupera tras castigo

flexibilidad:
  max_aplazamientos: 2          # BRAC: hasta 2 cuotas por crédito
  cuota_minima_pct: 0.35        # piso de cualquier cuota vs. la cuota fija
  cuota_maxima_mult: 1.80       # techo de cualquier cuota vs. la cuota fija (evita cuotas globo)
  recargo_spread_tea: 0.02      # Sonata: +2 pp por opción flexible
  max_meses_reducidos_anio: 4   # producto estacional: meses con cuota bajo la fija por año
  tolerancia_reduccion: 0.05    # una cuota < (1-tol)*fija cuenta como reducida
  requisito_dias_atraso_max: 8  # para ser elegible a flexibilidad (historial)
  pierde_flex_con_atraso_dias: 30

capacidad_pago:
  ratio_cuota_excedente_max: 0.70  # cuota <= 70% del excedente mensual (ingreso*margen - gasto familiar)
  cuantil_conservador: 0.25         # se diseña contra el escenario p25 de ingresos
  ratio_deuda_total_max: 0.80       # (cuota nueva + otras cuotas) / excedente  -> sobreendeudamiento

el_nino:
  rubros_expuestos: [agricultura, pesca, comercio_campana]
  meses_alivio: 3                   # cuotas al mínimo mientras dure la alerta (máx.)
  probabilidad_anual: 0.15          # probabilidad de alerta ENFEN usada en simulación
  caida_ingresos: {agricultura: 0.45, pesca: 0.55, comercio_campana: 0.20}

simulacion:
  semilla: 2026
  n_clientes: 600
  n_escenarios: 200
  dias_mora: 30
  meses_default: 3         # 3 cuotas impagas consecutivas -> default
  colchon_meses: 0.5       # ahorro inicial en meses de excedente
  fuga_caja_mensual: 0.15  # % del sobrante que se gasta/reinvierte cada mes (el microempresario no ahorra perfecto)

cartera_sintetica:              # calibrada en fase 2 contra la mora SBS de cajas municipales (ver resultados/calibracion.md)
  cuota_excedente_min: 0.30     # cuota fija solicitada como % del excedente libre
  cuota_excedente_max: 0.42
  prob_atrasos: [0.40, 0.22, 0.15, 0.11, 0.08, 0.04]   # días de atraso máx. 0/3/8/15/35/70

seleccion:
  modo: simulacion              # simulacion | regla (umbral de estacionalidad de la fase 1)
  n_escenarios: 200
  max_perdida_vpn_pct: 5        # el producto elegido no puede bajar el VPN más de 5% vs. la cuota fija

recargo:                        # recargo de TEA por modalidad; null = usa flexibilidad.recargo_spread_tea
  estacional: null
  aplazamiento: null

pronostico:                     # elegido por backtesting (resultados/backtest.md)
  metodo: perfil                # perfil | statsforecast | mixto
  peso_modelo: 0.3              # peso de statsforecast cuando metodo = mixto
  factor_sigma: 1.3             # calibra la cobertura p10–p90 a ~80% fuera de muestra

productos:                      # fase 4 · FAQ NEG-01: factor Cuota/UN por producto (configurable, siempre < 1)
  inclusion:     {nombre: "Inclusión financiera", factor: 0.65, max_meses_gracia: 4, permite_solo_interes: true}
  microempresa:  {nombre: "Microempresa", factor: 0.85, max_meses_gracia: 4, permite_solo_interes: true}
  tope_tea: 1.0                 # referencial: tasa máxima BCRP para consumo y MYPE (se actualiza cada semestre; verificar la vigente)

seguros_referenciales:          # tasas mensuales referenciales para la demo (la Caja confirma las suyas)
  desgravamen_tasa_mensual: 0.00077
  multirriesgo_tasa_mensual: 0.0003
